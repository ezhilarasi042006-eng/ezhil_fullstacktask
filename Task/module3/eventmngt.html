<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #333;
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 35px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .header-icon {
            font-size: 55px;
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* STATISTICS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 27px;
        }

        .stat-card h2 {
            color: #2563eb;
            font-size: 28px;
        }

        .stat-card p {
            color: #777;
            margin-top: 4px;
        }

        /* FORM */

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .title {
            font-size: 23px;
            margin-bottom: 25px;
            color: #222;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .full-width {
            grid-column: span 2;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .clear-btn {
            background: #e5e7eb;
            color: #333;
        }

        /* EVENT LIST */

        .events-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search {
            padding: 11px 15px;
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        /* TABLE */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8faff;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            padding: 7px 12px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            padding: 7px 12px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        /* FOOTER */

        footer {
            margin-top: 50px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

            .event-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search {
                width: 100%;
            }

            header {
                padding: 25px;
            }

            header h1 {
                font-size: 25px;
            }

        }

    </style>
</head>


<body>

    <!-- HEADER -->

    <header>

        <div>
            <h1>🎉 Event Management</h1>

            <p>
                Create, manage and organize your events easily
            </p>
        </div>

        <div class="header-icon">
            📅
        </div>

    </header>


    <div class="container">


        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    📅
                </div>

                <div>
                    <h2 id="totalEvents">0</h2>
                    <p>Total Events</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🎓
                </div>

                <div>
                    <h2 id="collegeEvents">0</h2>
                    <p>College Events</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    👥
                </div>

                <div>
                    <h2 id="totalParticipants">0</h2>
                    <p>Total Participants</p>
                </div>

            </div>

        </div>


        <!-- EVENT FORM -->

        <div class="form-section">

            <h2 class="title">
                ➕ Create New Event
            </h2>


            <form id="eventForm">

                <div class="form-grid">


                    <div class="input-group">

                        <label>Event Name</label>

                        <input
                            type="text"
                            id="eventName"
                            placeholder="Enter event name"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Event Type</label>

                        <select id="eventType" required>

                            <option value="">
                                Select Event Type
                            </option>

                            <option>
                                College Event
                            </option>

                            <option>
                                Workshop
                            </option>

                            <option>
                                Seminar
                            </option>

                            <option>
                                Hackathon
                            </option>

                            <option>
                                Cultural Event
                            </option>

                            <option>
                                Sports Event
                            </option>

                        </select>

                    </div>


                    <div class="input-group">

                        <label>Event Date</label>

                        <input
                            type="date"
                            id="eventDate"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Event Time</label>

                        <input
                            type="time"
                            id="eventTime"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Venue</label>

                        <input
                            type="text"
                            id="venue"
                            placeholder="Enter venue"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Organizer</label>

                        <input
                            type="text"
                            id="organizer"
                            placeholder="Enter organizer name"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Expected Participants</label>

                        <input
                            type="number"
                            id="participants"
                            placeholder="Enter number"
                            min="1"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Event Status</label>

                        <select id="status" required>

                            <option value="">
                                Select Status
                            </option>

                            <option>
                                Upcoming
                            </option>

                            <option>
                                Ongoing
                            </option>

                            <option>
                                Completed
                            </option>

                        </select>

                    </div>


                    <div class="input-group full-width">

                        <label>Description</label>

                        <textarea
                            id="description"
                            placeholder="Enter event description"
                            required>
                        </textarea>

                    </div>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="add-btn">

                        ➕ Add Event

                    </button>


                    <button
                        type="reset"
                        class="clear-btn">

                        Clear

                    </button>

                </div>

            </form>

        </div>


        <!-- EVENT LIST -->

        <div class="events-section">


            <div class="event-header">

                <h2 class="title">
                    📋 Event List
                </h2>


                <input
                    type="text"
                    id="search"
                    class="search"
                    placeholder="🔍 Search events...">

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Event</th>

                            <th>Type</th>

                            <th>Date</th>

                            <th>Time</th>

                            <th>Venue</th>

                            <th>Organizer</th>

                            <th>Participants</th>

                            <th>Status</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="eventTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Event Management System
        </p>

    </footer>



    <script>

        let events =
            JSON.parse(localStorage.getItem("events")) || [];

        let editIndex = -1;


        /* DISPLAY EVENTS */

        function displayEvents(list = events) {

            const table =
                document.getElementById("eventTable");

            table.innerHTML = "";


            if (list.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty">
                            No events available.
                        </td>
                    </tr>
                `;

                return;
            }


            list.forEach((event, index) => {

                table.innerHTML += `

                    <tr>

                        <td>
                            <strong>
                                ${event.name}
                            </strong>
                        </td>

                        <td>
                            ${event.type}
                        </td>

                        <td>
                            ${event.date}
                        </td>

                        <td>
                            ${event.time}
                        </td>

                        <td>
                            ${event.venue}
                        </td>

                        <td>
                            ${event.organizer}
                        </td>

                        <td>
                            ${event.participants}
                        </td>

                        <td>
                            ${event.status}
                        </td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editEvent(${index})">

                                Edit

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteEvent(${index})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            });

        }


        /* ADD EVENT */

        document
            .getElementById("eventForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const newEvent = {

                    name:
                        document
                        .getElementById("eventName")
                        .value,

                    type:
                        document
                        .getElementById("eventType")
                        .value,

                    date:
                        document
                        .getElementById("eventDate")
                        .value,

                    time:
                        document
                        .getElementById("eventTime")
                        .value,

                    venue:
                        document
                        .getElementById("venue")
                        .value,

                    organizer:
                        document
                        .getElementById("organizer")
                        .value,

                    participants:
                        document
                        .getElementById("participants")
                        .value,

                    status:
                        document
                        .getElementById("status")
                        .value,

                    description:
                        document
                        .getElementById("description")
                        .value
                };


                if (editIndex === -1) {

                    events.push(newEvent);

                } else {

                    events[editIndex] = newEvent;

                    editIndex = -1;

                }


                saveEvents();

                this.reset();

            });


        /* DELETE EVENT */

        function deleteEvent(index) {

            if (
                confirm(
                    "Are you sure you want to delete this event?"
                )
            ) {

                events.splice(index, 1);

                saveEvents();

            }

        }


        /* EDIT EVENT */

        function editEvent(index) {

            const event = events[index];


            document.getElementById("eventName").value =
                event.name;

            document.getElementById("eventType").value =
                event.type;

            document.getElementById("eventDate").value =
                event.date;

            document.getElementById("eventTime").value =
                event.time;

            document.getElementById("venue").value =
                event.venue;

            document.getElementById("organizer").value =
                event.organizer;

            document.getElementById("participants").value =
                event.participants;

            document.getElementById("status").value =
                event.status;

            document.getElementById("description").value =
                event.description;


            editIndex = index;


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* SEARCH */

        document
            .getElementById("search")
            .addEventListener("input", function() {

                const searchText =
                    this.value.toLowerCase();


                const filtered =
                    events.filter(event =>

                        event.name
                            .toLowerCase()
                            .includes(searchText)

                        ||

                        event.type
                            .toLowerCase()
                            .includes(searchText)

                        ||

                        event.venue
                            .toLowerCase()
                            .includes(searchText)

                        ||

                        event.organizer
                            .toLowerCase()
                            .includes(searchText)

                    );


                displayEvents(filtered);

            });


        /* SAVE */

        function saveEvents() {

            localStorage.setItem(
                "events",
                JSON.stringify(events)
            );

            displayEvents();

            updateStats();

        }


        /* STATISTICS */

        function updateStats() {

            document.getElementById("totalEvents")
                .textContent = events.length;


            document.getElementById("collegeEvents")
                .textContent =
                events.filter(
                    event =>
                    event.type === "College Event"
                ).length;


            let total = 0;

            events.forEach(event => {

                total +=
                    Number(event.participants);

            });


            document.getElementById("totalParticipants")
                .textContent = total;

        }


        /* INITIAL DISPLAY */

        displayEvents();

        updateStats();

    </script>

</body>

</html>
