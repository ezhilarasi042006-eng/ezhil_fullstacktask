<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #333;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 5px;
            opacity: 0.9;
        }

        .logo {
            font-size: 40px;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        /* Statistics */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card-icon {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            background: #ede9fe;
        }

        .card h3 {
            font-size: 28px;
            color: #4f46e5;
        }

        .card p {
            color: #777;
            margin-top: 4px;
        }

        /* Form */
        .form-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 25px;
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .input-group input,
        .input-group select {
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #4f46e5;
        }

        .button-area {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
        }

        .add-btn:hover {
            background: #4338ca;
        }

        .clear-btn {
            background: #e5e7eb;
            color: #333;
        }

        /* Student Table */
        .table-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search {
            padding: 11px 15px;
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f7ff;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            padding: 7px 12px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            padding: 7px 12px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        /* Responsive */
        @media (max-width: 768px) {

            header {
                padding: 20px;
            }

            .container {
                width: 95%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div>
            <h1>🎓 Student Management</h1>
            <p>Student Registration & Management System</p>
        </div>

        <div class="logo">
            📚
        </div>
    </header>


    <div class="container">

        <!-- Statistics -->
        <div class="stats">

            <div class="card">
                <div class="card-icon">👨‍🎓</div>
                <div>
                    <h3 id="totalStudents">0</h3>
                    <p>Total Students</p>
                </div>
            </div>

            <div class="card">
                <div class="card-icon">👨</div>
                <div>
                    <h3 id="maleStudents">0</h3>
                    <p>Male Students</p>
                </div>
            </div>

            <div class="card">
                <div class="card-icon">👩</div>
                <div>
                    <h3 id="femaleStudents">0</h3>
                    <p>Female Students</p>
                </div>
            </div>

        </div>


        <!-- Registration Form -->
        <div class="form-section">

            <h2 class="section-title">📝 Register New Student</h2>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="input-group">
                        <label>Student Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter student name"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Register Number</label>
                        <input
                            type="text"
                            id="regno"
                            placeholder="Enter register number"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Department</label>

                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option>Artificial Intelligence & Data Science</option>
                            <option>Computer Science Engineering</option>
                            <option>Information Technology</option>
                            <option>Electronics & Communication</option>
                            <option>Electrical & Electronics</option>
                            <option>Mechanical Engineering</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Gender</label>

                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Date of Birth</label>
                        <input type="date" id="dob" required>
                    </div>

                    <div class="input-group">
                        <label>Year</label>

                        <select id="year" required>
                            <option value="">Select Year</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </div>

                </div>

                <div class="button-area">
                    <button type="submit" class="add-btn">
                        ➕ Register Student
                    </button>

                    <button type="reset" class="clear-btn">
                        Clear
                    </button>
                </div>

            </form>

        </div>


        <!-- Student List -->
        <div class="table-section">

            <div class="table-header">

                <h2 class="section-title">
                    👥 Registered Students
                </h2>

                <input
                    type="text"
                    class="search"
                    id="search"
                    placeholder="🔍 Search student...">

            </div>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Register No</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Gender</th>
                            <th>Year</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        let students = JSON.parse(localStorage.getItem("students")) || [];

        let editIndex = -1;


        // Display students
        function displayStudents(list = students) {

            const table = document.getElementById("studentTable");

            table.innerHTML = "";

            if (list.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty">
                            No students registered yet.
                        </td>
                    </tr>
                `;

                return;
            }


            list.forEach((student, index) => {

                table.innerHTML += `
                    <tr>

                        <td>${student.regno}</td>

                        <td>${student.name}</td>

                        <td>${student.email}</td>

                        <td>${student.department}</td>

                        <td>${student.gender}</td>

                        <td>${student.year}</td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editStudent(${index})">
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteStudent(${index})">
                                Delete
                            </button>

                        </td>

                    </tr>
                `;
            });

        }


        // Add student
        document.getElementById("studentForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const student = {

                name: document.getElementById("name").value,

                regno: document.getElementById("regno").value,

                email: document.getElementById("email").value,

                phone: document.getElementById("phone").value,

                department: document.getElementById("department").value,

                gender: document.getElementById("gender").value,

                dob: document.getElementById("dob").value,

                year: document.getElementById("year").value
            };


            if (editIndex === -1) {

                students.push(student);

            } else {

                students[editIndex] = student;

                editIndex = -1;
            }


            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );


            this.reset();

            displayStudents();

            updateStats();

        });


        // Delete student
        function deleteStudent(index) {

            if (confirm("Are you sure you want to delete this student?")) {

                students.splice(index, 1);

                localStorage.setItem(
                    "students",
                    JSON.stringify(students)
                );

                displayStudents();

                updateStats();
            }

        }


        // Edit student
        function editStudent(index) {

            const student = students[index];

            document.getElementById("name").value = student.name;
            document.getElementById("regno").value = student.regno;
            document.getElementById("email").value = student.email;
            document.getElementById("phone").value = student.phone;
            document.getElementById("department").value = student.department;
            document.getElementById("gender").value = student.gender;
            document.getElementById("dob").value = student.dob;
            document.getElementById("year").value = student.year;

            editIndex = index;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // Search
        document.getElementById("search")
        .addEventListener("input", function() {

            const searchText = this.value.toLowerCase();

            const filtered = students.filter(student =>
                student.name.toLowerCase().includes(searchText) ||
                student.regno.toLowerCase().includes(searchText) ||
                student.department.toLowerCase().includes(searchText)
            );

            displayStudents(filtered);

        });


        // Statistics
        function updateStats() {

            document.getElementById("totalStudents")
                .textContent = students.length;

            document.getElementById("maleStudents")
                .textContent =
                students.filter(s => s.gender === "Male").length;

            document.getElementById("femaleStudents")
                .textContent =
                students.filter(s => s.gender === "Female").length;

        }


        // Initial display
        displayStudents();

        updateStats();

    </script>

</body>
</html>
